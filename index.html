<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <link rel="stylesheet" href="style.css">
    <body>
        <nav>
            <ul>
                <li>My Tic Tac Toe</li>
            </ul>
        </nav>
        <div class="gamecontainer">
            <div class="container">
        <div class="box bt-l bt-t"><span class="boxtext"></span></div>
        <div class="box bt-t"><span class="boxtext"></span></div>
        <div class="box bt-t bt-r"><span class="boxtext"></span></div>
        <div class="box bt-l"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box bt-r"><span class="boxtext"></span></div>
        <div class="box bt-d bt-l"><span class="boxtext"></span></div>
        <div class="box bt-d"><span class="boxtext"></span></div>
        <div class="box bt-d bt-r"><span class="boxtext"></span></div>
            </div>
            <div class="info">
                <h1>My Tic Tac Toe</h1>
                <h2>Turn Of X</h2>
                <button>Reset</button>
            </div>
        </div>


        <script src="script.js"></script>
    </body>
</html>
